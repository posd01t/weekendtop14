<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Résultats — Le weekend Top 14</title>
<meta name="theme-color" content="#0e3d27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <div class="kicker">Feuille de match</div>
    <h1>Les résultats</h1>
    <div class="rule"></div>
  </header>

  <!-- mot de passe -->
  <section id="gate" class="gate hidden">
    <div class="card">
      <header><span class="num">↯</span><h2>Entrée des joueurs</h2></header>
      <div class="body">
        <div class="howto"><p>Le mot de passe est dans le groupe Signal.</p></div>
        <form id="gate-form" novalidate>
          <div class="field">
            <div class="lab"><label for="gate-pw">Mot de passe</label></div>
            <input type="password" id="gate-pw" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
          </div>
          <div id="gate-error" class="alert hidden"></div>
          <button type="submit" class="btn block" id="gate-submit">Entrer</button>
        </form>
      </div>
    </div>
  </section>

  <main id="app" class="hidden">

    <!-- barrière de politesse : on répond d'abord -->
    <section id="not-voted" class="card hidden">
      <header><span class="num">!</span><h2>Réponds d'abord</h2></header>
      <div class="body">
        <p>Réponds d'abord, tu verras ensuite.</p>
        <a class="btn" href="index.html">Aller au sondage</a>
      </div>
    </section>

    <div id="loading" class="spinner">Chargement des réponses…</div>
    <div id="error" class="alert hidden"></div>

    <div id="results" class="hidden"></div>

    <div class="toolbar">
      <button type="button" class="btn ghost" id="refresh">Rafraîchir</button>
      <a href="index.html" style="color:rgba(255,255,255,.75)">Modifier ma réponse</a>
    </div>

    <footer class="foot">Le sondage éclaire, le groupe tranche.</footer>
  </main>

</div>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/results.js"></script>
</body>
</html>
